<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FULL Servis — Modem Stres Test Paneli</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <div>
        <h1>FULL Servis</h1>
        <p class="subtitle">Modem Stres Test Orkestrasyonu</p>
      </div>
    </div>

    <div class="session" id="session-box">
      <div class="session-info">
        <span class="badge" id="session-badge">Hazır</span>
        <span id="session-id">—</span>
      </div>
    </div>
  </header>

  <section class="controls">
    <div class="params">
      <label>Süre (sn) <input type="number" id="p-duration" placeholder="varsayılan" min="1" /></label>
      <label>Modem IP <input type="text" id="p-modem" placeholder="varsayılan" /></label>
      <label>İnternet IP <input type="text" id="p-internet" placeholder="varsayılan" /></label>
      <label class="wide">YouTube <input type="text" id="p-youtube" placeholder="varsayılan" /></label>
    </div>
    <div class="actions">
      <button id="btn-start" class="btn start">▶ FULL Servis Başlat</button>
      <button id="btn-stop" class="btn stop">■ Durdur</button>
    </div>
  </section>

  <main id="nodes" class="nodes"></main>

  <footer class="foot">
    <span id="conn-status">●</span> Sunucu: <span id="server-ip">—</span> ·
    Otomatik yenileme 1 sn
  </footer>

  <script src="app.js"></script>
</body>
</html>
